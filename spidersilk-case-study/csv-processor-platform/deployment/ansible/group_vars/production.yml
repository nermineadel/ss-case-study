---
env_identifier: production
target_k8s_namespace: app-csv-production

# Aggressive high availability scaling configurations
app_replicas: 5
hpa_min_pods: 5
hpa_max_pods: 25
hpa_cpu_trigger: 70

# Storage variables
s3_bucket_vault: "company-production-csv-data-vault"
iam_role_execution_arn: "arn:aws:iam::123456789012:role/irsa-csv-processor-production"
