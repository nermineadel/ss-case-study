apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "csv-processor.fullname" . }}-nginx-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "csv-processor.labels" . | nindent 4 }}
data:
  nginx.conf: |
    server {
        listen 80;
        server_name localhost;

        # Shared asset layer intercepts assets locally bypassing Python engine execution
        location /assets/ {
            alias /usr/share/nginx/html/assets/;
            expires 7d;
            access_log off;
            add_header Cache-Control "public, no-transform";
        }

        # Reverse proxy dynamic interactions down onto localhost loopback boundaries
        location / {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
